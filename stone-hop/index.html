<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no, minimum-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#7cc6ee">
<title>Stone Hopper</title>
<style>
  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    background: #7cc6ee;
    touch-action: none;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let DPR = 1, W = 0, H = 0;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const STATE = { TITLE: 0, IDLE: 1, CHARGING: 2, JUMPING: 3, FALLING: 4, GAME_OVER: 5 };

  const game = {
    state: STATE.TITLE,
    stones: [],
    camera: 0,
    cameraTarget: 0,
    score: 0,
    best: +(localStorage.getItem('stoneHopBest') || 0),
    charge: 0,
    chargeDir: 1,
    chargeRate: 360,        // px of jump distance per second of hold
    maxCharge: 520,
    minCharge: 40,
    player: { x: 0, y: 0, baseY: 0, rot: 0, squash: 0 },
    jump: { from: 0, to: 0, baseFromY: 0, baseToY: 0, t: 0, dur: 0.55, arc: 130, dead: false },
    fall: { vy: 0 },
    particles: [],
    splashes: [],
    clouds: [],
    waveT: 0,
    time: 0,
    flash: 0,
    titlePulse: 0,
    overFade: 0,
  };

  function waterLine() { return H * 0.68; }

  function rand(a, b) { return a + Math.random() * (b - a); }

  function makeStone(x, difficulty) {
    // stones shrink slowly with score; stay forgiving
    const minR = Math.max(24, 46 - difficulty * 1.2);
    const maxR = Math.max(minR + 8, 64 - difficulty * 1.0);
    return { x, r: rand(minR, maxR), bob: Math.random() * Math.PI * 2 };
  }

  function nextGap(difficulty) {
    const base = 120 + Math.min(difficulty * 6, 90);
    const variance = 60 + Math.min(difficulty * 4, 80);
    return base + Math.random() * variance;
  }

  function spawnAhead() {
    let last = game.stones[game.stones.length - 1];
    while (last.x - game.camera < W * 1.6) {
      const gap = nextGap(game.score);
      const s = makeStone(last.x + gap, game.score);
      game.stones.push(s);
      last = s;
    }
  }

  function seedClouds() {
    game.clouds = [];
    for (let i = 0; i < 6; i++) {
      game.clouds.push({
        x: rand(-W, W * 2),
        y: rand(20, H * 0.35),
        s: rand(0.6, 1.4),
        v: rand(6, 16),
      });
    }
  }

  function reset() {
    game.stones = [];
    const first = { x: W * 0.30, r: 54, bob: 0 };
    game.stones.push(first);
    let x = first.x;
    for (let i = 0; i < 4; i++) {
      x += nextGap(0);
      game.stones.push(makeStone(x, 0));
    }
    game.score = 0;
    game.charge = 0;
    game.chargeDir = 1;
    game.camera = 0;
    game.cameraTarget = 0;
    game.particles = [];
    game.splashes = [];
    game.flash = 0;
    game.overFade = 0;
    const s = game.stones[0];
    game.player.x = s.x;
    game.player.baseY = waterLine() - s.r * 0.9;
    game.player.y = game.player.baseY;
    game.player.rot = 0;
    game.player.squash = 0;
    spawnAhead();
    seedClouds();
  }

  function stoneAt(x) {
    for (const s of game.stones) {
      if (Math.abs(s.x - x) <= s.r * 0.92) return s;
    }
    return null;
  }

  // ---------- Input ----------
  function pointerDown() {
    if (game.state === STATE.TITLE) {
      reset();
      game.state = STATE.IDLE;
      return;
    }
    if (game.state === STATE.GAME_OVER) {
      if (game.overFade > 0.6) {
        reset();
        game.state = STATE.IDLE;
      }
      return;
    }
    if (game.state === STATE.IDLE) {
      game.state = STATE.CHARGING;
      game.charge = game.minCharge;
      game.chargeDir = 1;
    }
  }

  function pointerUp() {
    if (game.state === STATE.CHARGING) {
      launchJump();
    }
  }

  function launchJump() {
    const p = game.player;
    const distance = game.charge;
    game.jump.from = p.x;
    game.jump.to = p.x + distance;
    game.jump.baseFromY = p.baseY;

    // Find target stone (if any) to set landing y
    const target = stoneAt(game.jump.to);
    if (target) {
      game.jump.baseToY = waterLine() - target.r * 0.9;
      game.jump.dead = false;
    } else {
      // miss: land where water is
      game.jump.baseToY = waterLine() - 6;
      game.jump.dead = true;
    }
    // arc scales gently with distance
    game.jump.arc = Math.min(180, 90 + distance * 0.25);
    game.jump.dur = Math.min(0.85, 0.38 + distance * 0.0009);
    game.jump.t = 0;
    game.state = STATE.JUMPING;
    p.squash = 0;
  }

  canvas.addEventListener('touchstart', e => { e.preventDefault(); pointerDown(); }, { passive: false });
  canvas.addEventListener('touchend',   e => { e.preventDefault(); pointerUp();   }, { passive: false });
  canvas.addEventListener('touchcancel',e => { e.preventDefault(); pointerUp();   }, { passive: false });
  canvas.addEventListener('mousedown',  e => { e.preventDefault(); pointerDown(); });
  window.addEventListener('mouseup',    e => { pointerUp(); });
  window.addEventListener('keydown', e => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); pointerDown(); }
  });
  window.addEventListener('keyup', e => {
    if (e.code === 'Space') { e.preventDefault(); pointerUp(); }
  });

  // ---------- Update ----------
  function update(dt) {
    game.time += dt;
    game.waveT += dt;
    game.titlePulse += dt;

    // clouds
    for (const c of game.clouds) {
      c.x -= c.v * dt * c.s;
      if (c.x < game.camera - W * 0.5 - 200) c.x = game.camera + W + rand(0, W);
    }

    if (game.state === STATE.CHARGING) {
      game.charge += game.chargeRate * dt * game.chargeDir;
      if (game.charge >= game.maxCharge) { game.charge = game.maxCharge; game.chargeDir = -1; }
      if (game.charge <= game.minCharge) { game.charge = game.minCharge; game.chargeDir = 1; }
      // squash animation
      game.player.squash = Math.min(0.35, game.player.squash + dt * 1.4);
    } else {
      game.player.squash = Math.max(0, game.player.squash - dt * 3);
    }

    if (game.state === STATE.JUMPING) {
      const j = game.jump;
      j.t += dt;
      const u = Math.min(1, j.t / j.dur);
      const x = j.from + (j.to - j.from) * u;
      const baseY = j.baseFromY + (j.baseToY - j.baseFromY) * u;
      const arc = -4 * j.arc * u * (1 - u); // parabola peak at u=0.5
      const y = baseY + arc;
      game.player.x = x;
      game.player.y = y;
      // rotation: 1 full flip for long jumps, gentler for short
      game.player.rot = u * Math.PI * 2 * (j.to - j.from > 180 ? 1 : 0.5);
      if (u >= 1) {
        if (j.dead) {
          // fall into water
          game.state = STATE.FALLING;
          game.fall.vy = 60;
        } else {
          // landed
          game.player.rot = 0;
          game.score += 1;
          if (game.score > game.best) {
            game.best = game.score;
            localStorage.setItem('stoneHopBest', String(game.best));
          }
          dustBurst(game.player.x, game.player.baseY = j.baseToY);
          game.player.y = j.baseToY;
          game.flash = 0.15;
          // scroll camera so player is at left third
          game.cameraTarget = game.player.x - W * 0.32;
          game.state = STATE.IDLE;
          // drop trailing stones to keep array bounded
          while (game.stones.length > 0 && game.stones[0].x < game.camera - W * 0.4) {
            game.stones.shift();
          }
          spawnAhead();
        }
      }
    }

    if (game.state === STATE.FALLING) {
      game.player.y += game.fall.vy * dt + 220 * dt * dt;
      game.fall.vy += 900 * dt;
      game.player.rot += dt * 2;
      if (game.player.y > waterLine() && game.fall.vy > 60) {
        splash(game.player.x, waterLine());
        game.state = STATE.GAME_OVER;
      }
    }

    // camera lerp
    game.camera += (game.cameraTarget - game.camera) * Math.min(1, dt * 6);

    // game over fade-in for tap-to-restart prompt
    if (game.state === STATE.GAME_OVER) {
      game.overFade = Math.min(1, game.overFade + dt * 1.2);
    }

    // particles
    for (let i = game.particles.length - 1; i >= 0; i--) {
      const p = game.particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 400 * dt;
      if (p.life <= 0) game.particles.splice(i, 1);
    }
    for (let i = game.splashes.length - 1; i >= 0; i--) {
      const s = game.splashes[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      s.vy += 500 * dt;
      if (s.life <= 0) game.splashes.splice(i, 1);
    }

    if (game.flash > 0) game.flash = Math.max(0, game.flash - dt * 2);
  }

  function dustBurst(x, y) {
    for (let i = 0; i < 12; i++) {
      const a = -Math.PI + Math.random() * Math.PI;
      const s = rand(60, 180);
      game.particles.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s * 0.5 - 40,
        life: rand(0.3, 0.6), col: '#d8c39a', r: rand(2, 4),
      });
    }
  }

  function splash(x, y) {
    for (let i = 0; i < 28; i++) {
      const a = -Math.PI / 2 + rand(-1.0, 1.0);
      const s = rand(120, 360);
      game.splashes.push({
        x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: rand(0.5, 1.0), r: rand(2, 5),
      });
    }
  }

  // ---------- Draw ----------
  function draw() {
    // sky gradient
    const skyG = ctx.createLinearGradient(0, 0, 0, waterLine());
    skyG.addColorStop(0, '#9fdcff');
    skyG.addColorStop(1, '#d6f1ff');
    ctx.fillStyle = skyG;
    ctx.fillRect(0, 0, W, waterLine());

    // distant hills (parallax)
    drawHills(0.25, '#8ebf9d', waterLine() - 80);
    drawHills(0.45, '#6ea986', waterLine() - 50);

    // clouds
    for (const c of game.clouds) {
      drawCloud(c.x - game.camera * 0.3, c.y, c.s);
    }

    // water
    const waterG = ctx.createLinearGradient(0, waterLine(), 0, H);
    waterG.addColorStop(0, '#3d8fc8');
    waterG.addColorStop(1, '#1d4f7b');
    ctx.fillStyle = waterG;
    ctx.fillRect(0, waterLine(), W, H - waterLine());

    // wave lines
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1.5;
    for (let row = 0; row < 6; row++) {
      const yy = waterLine() + 10 + row * 18;
      ctx.beginPath();
      const phase = game.waveT * (0.6 + row * 0.15) + row;
      const camOff = game.camera * (0.6 + row * 0.05);
      for (let x = -10; x <= W + 10; x += 12) {
        const wy = yy + Math.sin((x + camOff) * 0.03 + phase) * 2.2;
        if (x === -10) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
      }
      ctx.stroke();
    }

    // ---- world-space layer ----
    ctx.save();
    ctx.translate(-game.camera, 0);

    // stone shadows on water
    for (const s of game.stones) {
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.beginPath();
      ctx.ellipse(s.x, waterLine() + 6, s.r * 0.95, s.r * 0.22, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // stones
    for (const s of game.stones) {
      drawStone(s);
    }

    // player
    drawFrog();

    // particles
    for (const p of game.particles) {
      ctx.fillStyle = p.col;
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }

    ctx.restore();

    // splashes (screen space because they happen at fixed camera offset is fine; they're in world coords too but white)
    ctx.save();
    ctx.translate(-game.camera, 0);
    for (const s of game.splashes) {
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.globalAlpha = Math.max(0, Math.min(1, s.life));
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    // charge bar above player
    if (game.state === STATE.CHARGING) drawChargeBar();

    // HUD
    drawHUD();

    // flash
    if (game.flash > 0) {
      ctx.fillStyle = `rgba(255,255,255,${game.flash})`;
      ctx.fillRect(0, 0, W, H);
    }

    // title / game over overlays
    if (game.state === STATE.TITLE) drawTitle();
    if (game.state === STATE.GAME_OVER) drawGameOver();
  }

  function drawHills(parallax, color, baseY) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, baseY);
    const off = game.camera * parallax;
    for (let x = 0; x <= W; x += 20) {
      const y = baseY - 30 - Math.sin((x + off) * 0.01) * 18 - Math.sin((x + off) * 0.003) * 26;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, waterLine());
    ctx.lineTo(0, waterLine());
    ctx.closePath();
    ctx.fill();
  }

  function drawCloud(x, y, s) {
    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    ctx.beginPath();
    ctx.arc(x,        y,      18 * s, 0, Math.PI * 2);
    ctx.arc(x + 20*s, y - 6*s, 22 * s, 0, Math.PI * 2);
    ctx.arc(x + 44*s, y,      18 * s, 0, Math.PI * 2);
    ctx.arc(x + 24*s, y + 6*s, 20 * s, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawStone(s) {
    const top = waterLine() - s.r * 0.9;
    // body
    const g = ctx.createLinearGradient(0, top - s.r, 0, waterLine() + 6);
    g.addColorStop(0, '#9a8c75');
    g.addColorStop(0.5, '#6b5d4a');
    g.addColorStop(1, '#3a3024');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(s.x, top, s.r, s.r * 0.55, 0, 0, Math.PI, false);
    ctx.lineTo(s.x + s.r, waterLine() + 4);
    ctx.lineTo(s.x - s.r, waterLine() + 4);
    ctx.closePath();
    ctx.fill();
    // top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.20)';
    ctx.beginPath();
    ctx.ellipse(s.x - s.r * 0.15, top - 2, s.r * 0.65, s.r * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
    // moss
    ctx.fillStyle = '#5fa463';
    ctx.beginPath();
    ctx.ellipse(s.x + s.r * 0.25, top + 1, s.r * 0.35, 4, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawFrog() {
    const p = game.player;
    const squash = p.squash;
    const sx = 1 + squash * 0.5;
    const sy = 1 - squash * 0.6;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.scale(sx, sy);

    // body
    ctx.fillStyle = '#5dbb3a';
    ctx.beginPath();
    ctx.ellipse(0, -14, 18, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    // belly
    ctx.fillStyle = '#f1efb8';
    ctx.beginPath();
    ctx.ellipse(0, -10, 11, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    // back legs
    ctx.fillStyle = '#4ca031';
    ctx.beginPath(); ctx.ellipse(-14, -6, 7, 4, 0.4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse( 14, -6, 7, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    // eyes
    ctx.fillStyle = '#5dbb3a';
    ctx.beginPath(); ctx.arc(-7, -26, 6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 7, -26, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7, -26, 4, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 7, -26, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-6, -26, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc( 8, -26, 2, 0, Math.PI * 2); ctx.fill();
    // mouth (smile)
    ctx.strokeStyle = '#2c5e1b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(0, -12, 5, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
  }

  function drawChargeBar() {
    const p = game.player;
    const sx = p.x - game.camera;
    const sy = p.y - 60;
    const w = 70, h = 8;
    const x = sx - w / 2, y = sy;
    // back
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    roundRect(x - 2, y - 2, w + 4, h + 4, 5); ctx.fill();
    // fill
    const t = (game.charge - game.minCharge) / (game.maxCharge - game.minCharge);
    const fillW = Math.max(2, w * t);
    const grad = ctx.createLinearGradient(x, 0, x + w, 0);
    grad.addColorStop(0, '#7be57b');
    grad.addColorStop(0.5, '#f7e96b');
    grad.addColorStop(1, '#ff6b6b');
    ctx.fillStyle = grad;
    roundRect(x, y, fillW, h, 4); ctx.fill();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawHUD() {
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.4)';
    ctx.lineWidth = 4;
    ctx.font = '700 38px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.strokeText(String(game.score), W / 2, 18);
    ctx.fillText(String(game.score), W / 2, 18);

    ctx.font = '600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.textAlign = 'right';
    ctx.strokeText('BEST  ' + game.best, W - 14, 22);
    ctx.fillText('BEST  ' + game.best, W - 14, 22);
  }

  function drawTitle() {
    ctx.fillStyle = 'rgba(0,0,0,0.30)';
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.5)';
    ctx.lineWidth = 6;
    ctx.font = '900 64px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.strokeText('STONE HOPPER', W / 2, H * 0.32);
    ctx.fillText('STONE HOPPER', W / 2, H * 0.32);

    ctx.font = '600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    const pulse = 0.55 + 0.45 * Math.sin(game.titlePulse * 3);
    ctx.globalAlpha = pulse;
    ctx.strokeText('TAP & HOLD  →  RELEASE TO JUMP', W / 2, H * 0.50);
    ctx.fillText('TAP & HOLD  →  RELEASE TO JUMP', W / 2, H * 0.50);
    ctx.globalAlpha = 1;

    ctx.font = '500 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.fillText('tap anywhere to start', W / 2, H * 0.58);
  }

  function drawGameOver() {
    ctx.fillStyle = `rgba(0,0,0,${0.45 * game.overFade})`;
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = game.overFade;
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = 6;

    ctx.font = '900 56px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.strokeText('SPLASH!', W / 2, H * 0.35);
    ctx.fillText('SPLASH!', W / 2, H * 0.35);

    ctx.font = '700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeText('Score  ' + game.score, W / 2, H * 0.46);
    ctx.fillText('Score  ' + game.score, W / 2, H * 0.46);

    ctx.font = '600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.lineWidth = 3;
    ctx.strokeText('Best  ' + game.best, W / 2, H * 0.52);
    ctx.fillText('Best  ' + game.best, W / 2, H * 0.52);

    if (game.overFade > 0.6) {
      const pulse = 0.55 + 0.45 * Math.sin(game.time * 4);
      ctx.globalAlpha = game.overFade * pulse;
      ctx.font = '600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText('tap to try again', W / 2, H * 0.62);
    }
    ctx.globalAlpha = 1;
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }
  seedClouds();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
